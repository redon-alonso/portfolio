<a class="saltar" href="#contenido">Saltar al contenido</a>

<header class="cabecera">
  <div class="envoltorio fila">
    <a routerLink="/" class="marca" aria-label="Víctor Alonso Gómez, inicio">
      <span class="monograma" aria-hidden="true">VA</span>
      <span class="marca-texto" aria-hidden="true">víctor.alonso</span>
    </a>
    <nav aria-label="Principal">
      <ul>
        <li><a routerLink="/" fragment="proyectos">/proyectos</a></li>
        <li><a routerLink="/" fragment="metodo">/método</a></li>
        <li><a routerLink="/" fragment="trayectoria">/trayectoria</a></li>
        <li><a routerLink="/blog" routerLinkActive="activo" ariaCurrentWhenActive="page">/blog</a></li>
      </ul>
    </nav>
    <a routerLink="/" fragment="contacto" class="hablemos">hablemos <span aria-hidden="true">↗</span></a>
  </div>
</header>

<main id="contenido" tabindex="-1">
  <router-outlet />
</main>

<footer class="pie envoltorio">
  <p class="firma" aria-hidden="true">víctor<span>.</span>alonso</p>
  <div class="pie-fila">
    <p>EOF · © {{ anio }} {{ sitio.nombre }}</p>
    <ul>
      <li><a [href]="contacto.github" target="_blank" rel="noopener noreferrer">github</a></li>
      @if (contacto.linkedin) {
        <li><a [href]="contacto.linkedin" target="_blank" rel="noopener noreferrer">linkedin</a></li>
      }
      <li><a href="/rss.xml">rss</a></li>
    </ul>
  </div>
</footer>
